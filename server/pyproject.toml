[project]
name = "oblachko-server"
version = "0.1.0"
description = "Local backend for Oblachko: detects manga text, runs OCR and translates via a local LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    # 1.24+ is built against CUDA 13, torch cu128 ships CUDA 12 DLLs that ORT reuses via preload_dlls()
    "onnxruntime-gpu>=1.20,<1.24",
    "torch>=2.7",
    "manga-ocr>=0.1.14",
    "rapidocr>=3.0",
]

[tool.uv]
package = false

# CUDA 12.8 build: required for RTX 50xx (Blackwell), also works on RTX 30xx
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
